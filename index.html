<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00594f">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Kapazitätsplanung Team</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <a class="skip-link" href="#inhalt">Zum Inhalt springen</a>
  <div class="prototyp-hinweis" role="note">Prototyp – nur erfundene Daten verwenden. Daten bleiben in diesem Browser.</div>
  <header class="kopf">
    <div class="kopf-zeile">
      <span class="app-name">Kapazitätsplanung</span>
      <div class="feld feld-inline nutzer">
        <label for="nutzer">Angemeldet als <span class="hinweis">(Simulation)</span></label>
        <select id="nutzer" data-action="nutzer"></select>
      </div>
    </div>
    <nav aria-label="Hauptnavigation">
      <ul class="tabs">
        <li><button type="button" data-view-tab="uebersicht">Übersicht</button></li>
        <li><button type="button" data-view-tab="planung">Planen</button></li>
        <li><button type="button" data-view-tab="grunddaten">Grunddaten</button></li>
        <li><button type="button" data-view-tab="abstimmung">Abstimmung</button></li>
        <li><button type="button" data-view-tab="einrichtung">Einrichtung</button></li>
      </ul>
    </nav>
  </header>
  <main id="inhalt"></main>
  <div id="status-meldung" class="sr-live" role="status" aria-live="polite"></div>
  <dialog id="detail" aria-labelledby="detail-titel"><div class="dialog-inhalt"></div></dialog>
  <dialog id="bestaetigen" aria-labelledby="b-titel">
    <form method="dialog" class="dialog-inhalt">
      <h2 id="b-titel">Bitte bestätigen</h2>
      <p class="b-text"></p>
      <p class="aktionen"><button type="submit" class="btn" value="ok">Bestätigen</button>
      <button type="submit" class="btn btn-zweit" value="abbrechen">Abbrechen</button></p>
    </form>
  </dialog>
  <noscript>Für diese Anwendung wird JavaScript benötigt.</noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
